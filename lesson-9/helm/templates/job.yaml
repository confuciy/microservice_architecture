{{- if .Values.job.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migration
spec:
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  template:
    spec:
      initContainers:
      - name: delay
        image: busybox
        command: ["sh", "-c", "sleep 30"]  # Задержка 60 секунд
      restartPolicy: OnFailure # Never
      containers:
        - name: migration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
          - secretRef:
              name: {{ .Release.Name }}-secrets
          command: ["php", "-r"] # используем sh для выполнения нескольких команд
          args:
            - "require './src/Migration/migrate.php';"
{{- end }}
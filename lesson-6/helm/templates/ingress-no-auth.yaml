{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
  - host: arch.homework
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: php-app
            port:
              number: 80
      - path: /api_metrics
        pathType: Exact
        backend:
          service:
            name: php-app
            port:
              number: 80
      - path: /auth/token
        pathType: Exact
        backend:
          service:
            name: service-auth
            port:
              number: 80
      - path: /user/register
        pathType: Exact
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /user/create
        pathType: Exact
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /user/login
        pathType: Exact
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /user/auth
        pathType: Exact
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /notification
        pathType: Exact
        backend:
          service:
            name: service-notification
            port:
              number: 80
{{- end }}
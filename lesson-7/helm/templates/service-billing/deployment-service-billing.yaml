apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-billing
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: service-billing
  template:
    metadata:
      labels:
        app: service-billing
    spec:
      containers:
      - name: service-billing
        image: "{{ .Values.image.repository }}:{{ .Values.image.tags.service_billing }}"
        imagePullPolicy: Always
        env:
        - name: SERVICE_NAME      # Определяем, какой сервис запустить
          value: "service-billing"
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5  # Задержка перед первым запуском проверки
          periodSeconds: 10       # Как часто выполнять проверку
          timeoutSeconds: 5       # Максимальное время ожидания ответа на запрос
          failureThreshold: 3     # Количество неудачных попыток, прежде чем контейнер будет перезапущен
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10 # Задержка перед первым запуском проверки
          periodSeconds: 10       # Как часто выполнять проверку
          timeoutSeconds: 5       # Максимальное время ожидания ответа на запрос
          failureThreshold: 3     # Количество неудачных попыток, прежде чем контейнер будет исключен из списка доступных
        envFrom:
        - secretRef:
           name: {{ .Release.Name }}-secrets
#        command: ["php", "-r"] # используем sh для выполнения нескольких команд
#        args:
#          - "require './src/Service/Billing/RabbitMQ/BillingReceive.php';"
#        resources:
#          {{- toYaml .Values.rabbitmqConsumer.resources | nindent 10 }}
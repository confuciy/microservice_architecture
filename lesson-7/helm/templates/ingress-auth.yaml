{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: protected-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-method: "GET"
    nginx.ingress.kubernetes.io/auth-url: "http://service-auth.default.svc.cluster.local:80/auth/validate"
    nginx.ingress.kubernetes.io/auth-cookie: "user_jwt"
    nginx.ingress.kubernetes.io/auth-cookie-path: "/"
    nginx.ingress.kubernetes.io/auth-cookie-domain: "arch.homework"
    nginx.ingress.kubernetes.io/auth-fail-action: "deny"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: arch.homework
    http:
      paths:
      - path: /user/(\d+)  # Регулярное выражение для всех подпутей
        pathType: ImplementationSpecific  # Обязательно для работы с regex
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /user/update
        pathType: Exact
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /user/delete
        pathType: Exact
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /user/edit
        pathType: Exact
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /user/profile
        pathType: Exact
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /user/exit
        pathType: Exact
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /auth/data
        pathType: Exact
        backend:
          service:
            name: service-auth
            port:
              number: 80
      - path: /auth/exit
        pathType: Exact
        backend:
          service:
            name: service-auth
            port:
              number: 80
{{- end }}
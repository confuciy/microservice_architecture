apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-user
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: service-user
  template:
    metadata:
      labels:
        app: service-user
    spec:
      containers:
      - name: service-user
        image: "{{ .Values.image.repository }}:{{ .Values.image.tags.service_user }}"
        imagePullPolicy: Always
        env:
        - name: SERVICE_NAME      # Определяем, какой сервис запустить
          value: "service-user"
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5  # Задержка перед первым запуском проверки
          periodSeconds: 10       # Как часто выполнять проверку
          timeoutSeconds: 5       # Максимальное время ожидания ответа на запрос
          failureThreshold: 3     # Количество неудачных попыток, прежде чем контейнер будет перезапущен
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10 # Задержка перед первым запуском проверки
          periodSeconds: 10       # Как часто выполнять проверку
          timeoutSeconds: 5       # Максимальное время ожидания ответа на запрос
          failureThreshold: 3     # Количество неудачных попыток, прежде чем контейнер будет исключен из списка доступных
        envFrom:
        - secretRef:
           name: {{ .Release.Name }}-secrets
        #command: ["php", "-r"] # используем sh для выполнения нескольких команд
        #args:
        #  - "require './src/Service/User/RabbitMQ/Receive.php';"
        #command: ["sh", "-c"]
        #args:
        #  - "sleep 60 && php -r \"require './src/Service/User/RabbitMQ/Receive.php';\""
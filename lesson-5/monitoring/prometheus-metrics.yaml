- job_name: 'nginx-exporter-metrics'
  metrics_path: /metrics  # Путь к метрикам экспортера
  static_configs:
  - targets: ['nginx-exporter-metrics:9113']  # Адрес Nginx Exporter
- job_name: 'api-metrics'
  metrics_path: /api_metrics  # Путь к метрикам
  static_configs:
  - targets: ['api-metrics:80']
- job_name: 'ingress-nginx-metrics'
  metrics_path: /metrics
  static_configs:
  - targets: ['ingress-nginx-controller-metrics.ingress-nginx.svc.cluster.local:10254']
- job_name: 'postgres-exporter'
  static_configs:
    - targets: ['192.168.0.129:9187']  # IP хоста Ubuntu и порт экспортера

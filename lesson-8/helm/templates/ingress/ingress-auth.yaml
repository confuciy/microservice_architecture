{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: protected-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-method: "GET"
    nginx.ingress.kubernetes.io/auth-url: "http://service-auth.default.svc.cluster.local:80/auth/validate"
    nginx.ingress.kubernetes.io/auth-cookie: "user_jwt"
    nginx.ingress.kubernetes.io/auth-cookie-path: "/"
    nginx.ingress.kubernetes.io/auth-cookie-domain: "arch.homework"
    nginx.ingress.kubernetes.io/auth-fail-action: "deny"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/upstream-max-fails: "5"
    nginx.ingress.kubernetes.io/upstream-fail-timeout: "30s"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_503 http_504"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "3"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5s"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "40s"
spec:
  ingressClassName: nginx
  rules:
  - host: arch.homework
    http:
      paths:
      - path: /user/(\d+)  # Регулярное выражение для всех подпутей
        pathType: ImplementationSpecific  # Обязательно для работы с regex
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /user/update
        pathType: Exact
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /user/delete
        pathType: Exact
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /user/profile
        pathType: Exact
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /user/edit
        pathType: Exact
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /user/notification
        pathType: Exact
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /user/order
        pathType: Exact
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /user/billing
        pathType: Exact
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /user/exit
        pathType: Exact
        backend:
          service:
            name: service-user
            port:
              number: 80
      - path: /auth/data
        pathType: Exact
        backend:
          service:
            name: service-auth
            port:
              number: 80
      - path: /order
        pathType: Exact
        backend:
          service:
            name: service-order
            port:
              number: 80
      - path: /order/check
        pathType: Exact
        backend:
          service:
            name: service-order
            port:
              number: 80
      - path: /billing
        pathType: Exact
        backend:
          service:
            name: service-billing
            port:
              number: 80
      - path: /billing/amount
        pathType: Exact
        backend:
          service:
            name: service-billing
            port:
              number: 80
      - path: /billing/compensate
        pathType: Exact
        backend:
          service:
            name: service-billing
            port:
              number: 80
      - path: /notification
        pathType: Exact
        backend:
          service:
            name: service-notification
            port:
              number: 80
      - path: /warehouse
        pathType: Exact
        backend:
          service:
            name: service-warehouse
            port:
              number: 80
      - path: /warehouse/order
        pathType: Exact
        backend:
          service:
            name: service-warehouse
            port:
              number: 80
      - path: /warehouse/compensate
        pathType: Exact
        backend:
          service:
            name: service-warehouse
            port:
              number: 80
{{- end }}